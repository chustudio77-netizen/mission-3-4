<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


</head>

<body>

    <%- include('./layout/header'); -%>
        <div class="container">
            <div class="favorites">
                <h1><i class="bi bi-check-circle-fill"></i> 我的收藏</h1>
                <div>
                    <i class="bi bi-truck"></i> 門市營業時間：週一至週五 10:00 - 22:00
                </div>
                <div class="row">
                    <div class="col">
                        <img src="../assets/scss/images/product.png" alt="">
                        <div class="text">
                            <h3>PLATFORM 404</h3>
                            <div class="size">
                                顏色 <p>38</p>
                            </div>
                            <div class="color">
                                顏色 <p>NAVY</p>
                            </div>

                            <div class="price">NT$2,600</div>
                        </div>
                    </div>
                    <hr>
                    <div class="col">
                        <img src="../assets/scss/images/product-4.png" alt="">
                        <div class="text">
                            <h3>BOOMLOK</h3>
                            <div class="size">
                                顏色 <p>38</p>
                            </div>
                            <div class="color">
                                顏色 <p>White</p>
                            </div>

                            <div class="price">NT$2,600</div>
                        </div>
                    </div>
                    <hr>
                    <div class="col">
                        <img src="../assets/scss/images/product-3.png" alt="">
                        <div class="text">
                            <h3>MELTY KISS</h3>
                            <div class="size">
                                顏色 <p>38</p>
                            </div>
                            <div class="color">
                                顏色 <p>Violet</p>
                            </div>

                            <div class="price">NT$2,600</div>
                        </div>
                    </div>

                </div>

            </div>
            <div class="detail_cta">

                <button class="dark"><i class="bi bi-handbag"></i> 門市預約試穿</button>
            </div>
        </div>
        <%- include('./layout/footer'); -%>

            <script type="module" src="../main.js"></script>
</body>

</html>
