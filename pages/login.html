<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入/註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


</head>

<body>

    <%- include('./layout/header'); -%>
        <div class="container ">
            <div class="favorites ">
                <h1><i class="bi bi-check-circle-fill"></i> 我的收藏</h1>
                <div class="hours">
                    <i class="bi bi-truck"></i><span> 門市營業時間：<span>週一至週五 10:00 - 22:00</span></span>
                </div>

                <div class=" wishlist ">
                    <div class="col ">
                        <img src="../assets/scss/images/product.png" alt="">
                        <div class="text row-column ">
                            <h3>PLATFORM 404</h3>
                            <p>尺寸 <span>38</span></p>
                            <p>顏色 <span>NAVY</span></p>
                            <div class="price">NT$2,600</div>
                        </div>
                    </div>

                    <div class="col">
                        <img src="../assets/scss/images/product-4.png" alt="">
                        <div class="text row-column">
                            <h3>BOOMLOK</h3>
                            <p>尺寸 <span>38</span></p>
                            <p>顏色 <span>White</span></p>


                            <div class="price">NT$2,600</div>
                        </div>
                    </div>

                    <div class="col">
                        <img src="../assets/scss/images/product-3.png" alt="">
                        <div class="text row-column">
                            <h3>MELTY KISS</h3>
                            <p>尺寸 <span>38</span></p>
                            <p>顏色 <span>Violet</span></p>
                            <div class="price">NT$2,600</div>
                        </div>
                    </div>

                </div>


                <div class="detail_cta">

                    <button class="dark">立即預約門市試穿</button>
                </div>
            </div>
        </div>

        <%- include('./layout/footer'); -%>

            <script type="module" src="../main.js"></script>
              <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
