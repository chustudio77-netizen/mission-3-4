<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入/註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


</head>

<body>

    <%- include('./layout/header'); -%>
        <img class="d-sm-none " src="../assets/scss/images/2025-week3-4/login-sm.png" alt="">
        <div class="container ">
            <div class="login row ">
                <div class="col-5 col-sm-12 ">
                    <div class="login-img">

                        <img class=" d-lg-block d-none "
                            src="https://github.com/hexschool/2022-web-layout-training/blob/main/2025-week3-4/login.png?raw=true"
                            alt="">
                    </div>
                </div>
                <div class=" col-7 col-sm-12">
                    <div class="login-page">
                        <h1>歡迎!</h1>
                        <nav>
                            <div class="w-100 flex-nowrap nav nav-tabs " id="nav-tab" role="tablist">
                                <button class="w-100 nav-link active "  id="nav-home-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home"
                                    aria-selected="true">登入</button>
                                <button class="w-100 nav-link " id="nav-profile-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-profile" type="button" role="tab" aria-controls="nav-profile"
                                    aria-selected="false">註冊</button>

                            </div>
                        </nav>
                        <div class="tab-content login-content" id="nav-tabContent">
                            <div class="tab-pane fade show active" id="nav-home" role="tabpanel"
                                aria-labelledby="nav-home-tab">
                                <ul>
                                    <li><a href=""><img src="../assets/scss/images/2025-week3-4/facebook.svg"
                                                alt="登入圖示1"> Facebook 登入 </a></li>
                                    <li><a href=""><img src="../assets/scss/images/2025-week3-4/apple.svg" alt="登入圖示2">
                                            Apple 登入 </a></li>
                                    <li><a href=""><img src="../assets/scss/images/2025-week3-4/google.svg" alt="登入圖示3">
                                            Google 登入 </a></li>
                                </ul>
                            </div>
                            <div class="tab-pane fade" id="nav-profile" role="tabpanel"
                                aria-labelledby="nav-profile-tab">
                                <ul>
                                    <li><a href=""><img src="../assets/scss/images/2025-week3-4/facebook.svg"
                                                alt="登入圖示1"> Facebook 註冊 </a></li>
                                    <li><a href=""><img src="../assets/scss/images/2025-week3-4/apple.svg" alt="登入圖示2">
                                            Apple 註冊 </a></li>
                                    <li><a href=""><img src="../assets/scss/images/2025-week3-4/google.svg" alt="登入圖示3">
                                            Google 註冊 </a></li>
                                </ul>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <%- include('./layout/footer'); -%>

            <script type="module" src="../main.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
